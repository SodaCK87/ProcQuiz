# 推上 main 就重建網站並發布到 GitHub Pages；測試沒過就不發布
name: 發布網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 完整歷史與 tag：run_gate.py 的建置產出檢查要用 git describe 核對最近的 tag 等於 package.json 的版本
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # 與本機交付前跑的是同一支：Python 測試（含已提交的題庫 JSON 等於重跑結果）、網站測試、建置
      - run: python tools/run_gate.py
      # 相依弱點（全面盤點 D-03）：版本釘死之後出新弱點沒人知道。兩個都要連網查資料庫，放 CI 不放本機把關；查到就不發布，
      # 修法是升版後重跑測試（pypdf 6.19.0 就是這樣升的）。pip-audit 只是 CI 的工具，不進 requirements.txt
      - run: pip install pip-audit && python -m pip_audit --disable-pip --no-deps -r requirements.txt
      - run: npm audit --audit-level=high
        working-directory: web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
